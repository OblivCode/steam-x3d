[project]
name = "steam-x3d"
version = "0.1.0"
description = "Per-launch V-Cache CPU placement; no global system tuning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
steam-x3d = "steam_x3d.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
